{% extends "base.html" %}
{% block title %}Reset Password - Scribbly{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title mb-1 fw-bold"><i class="bi bi-key me-2"></i>Reset Password</h4>
          <p class="text-muted small mb-4">Enter your email and we'll send you a reset link.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_email" class="form-label">Email Address</label>
              {{ form.email }}
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-envelope me-2"></i>Send Reset Link</button>
          </form>
          <div class="mt-3 text-center">
            <a href="{% url 'login' %}" class="text-muted small">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
