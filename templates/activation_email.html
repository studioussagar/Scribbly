<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activate your account</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px;">
        <h2 style="color: #333;">Welcome to Scribbly, {{ user.name }}!</h2>
        <p>You're almost there. Please click the button below to verify your email address and activate your account.</p>
        <p style="text-align: center; margin-top: 30px;">
            <a href="{{ protocol }}://{{ domain }}/activate/{{ uid }}/{{ token }}/" 
               style="background-color: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">
               Activate Account
            </a>
        </p>
        <p style="margin-top: 30px; font-size: 0.9em; color: #777;">
            If you did not sign up for this account, you can safely ignore this email.
        </p>
    </div>
</body>
</html>
