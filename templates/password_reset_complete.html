{% extends "base.html" %}
{% block title %}Password Reset Complete - Scribbly{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
  <div class="mx-auto" style="max-width: 480px;">
    <div style="font-size:4rem;">✅</div>
    <h3 class="fw-bold mt-3">Password Reset Complete!</h3>
    <p class="text-muted">Your password has been successfully changed. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary rounded-pill mt-2"><i class="bi bi-box-arrow-in-right me-2"></i>Log In</a>
  </div>
</div>
{% endblock %}
