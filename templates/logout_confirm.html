{% extends "base.html" %}

{% block title %}Confirm Logout - Scribbly{% endblock %}

{% block content %}
<div class="container text-center py-5 mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 400px; background-color: var(--card-bg-color);">
        <div class="card-body">
            <h4 class="card-title mb-4">Log Out</h4>
            <p class="mb-4">Are you sure you want to log out?</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Log Out</button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
