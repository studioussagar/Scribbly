{% extends "base.html" %}

{% block title %}Page Not Found - Scribbly{% endblock %}

{% block content %}
<div class="container text-center py-5 mt-5">
    <h1 class="display-1 text-primary mb-4">404</h1>
    <h2 class="mb-4">Oops! Page not found.</h2>
    <p class="text-muted mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="{% url 'home_view' %}" class="btn btn-primary px-4 py-2">Go Home</a>
</div>
{% endblock %}
