{% extends "base.html" %}
{% block title %}Check Your Email - Scribbly{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
  <div class="mx-auto" style="max-width: 480px;">
    <div style="font-size:4rem;">📬</div>
    <h3 class="fw-bold mt-3">Check your inbox</h3>
    <p class="text-muted">We've sent a password reset link to your email address. It may take a minute to arrive.</p>
    <a href="{% url 'login' %}" class="btn btn-outline-secondary rounded-pill mt-2"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
  </div>
</div>
{% endblock %}
